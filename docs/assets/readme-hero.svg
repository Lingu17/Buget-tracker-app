<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc">
  <title id="title">Budget Tracker — Log it in a second. Know your balance.</title>
  <desc id="desc">Budget Tracker is a single-page vanilla JavaScript app for logging income and expenses with live income, expense and balance totals.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b0f0c"/><stop offset="1" stop-color="#12221a"/></linearGradient>
    <linearGradient id="accent" x1="0" x2="1"><stop stop-color="#a3e635"/><stop offset="1" stop-color="#34d399"/></linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#94a3b8" opacity=".12"/></pattern>
  </defs>
  <rect width="1200" height="460" rx="24" fill="url(#background)"/>
  <rect width="1200" height="460" rx="24" fill="url(#dots)"/>
  <path d="M700 0H1100L800 460H400Z" fill="#a3e635" opacity=".04"/>
  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <path d="m57 40 16-8 16 8-16 8Zm0 8 16 8 16-8M57 56l16 8 16-8" fill="none" stroke="#a3e635" stroke-width="2.5" stroke-linejoin="round"/>
    <text x="103" y="56" fill="#f8fafc" font-size="23.0" font-weight="700">Budget<tspan fill="#a3e635"> Tracker</tspan></text>
    <text x="56" y="128" fill="#f8fafc" font-size="54.0" font-weight="750" letter-spacing="-2">Log it in a second.</text>
    <text x="56" y="190" fill="url(#accent)" font-size="54.0" font-weight="750" letter-spacing="-2">Know your balance.</text>
    <text x="58" y="228" fill="#cbd5e1" font-size="18.0">A dependency-free budget tracker in HTML, CSS and vanilla JavaScript.</text>
    <rect x="842" y="72" width="302" height="159" rx="14" fill="#0b1020" stroke="#37304f"/>
    <path d="M842 110h302" stroke="#37304f"/>
    <circle cx="861" cy="91" r="4" fill="#a3e635"/><circle cx="876" cy="91" r="4" fill="#475569"/><circle cx="891" cy="91" r="4" fill="#475569"/>
    <text x="916" y="96" fill="#94a3b8" font-size="12">budget / ledger</text>
    <g font-family="Consolas,Monaco,monospace" font-size="14.0">
      <text x="862" y="138" fill="#a3e635">+5000 salary<tspan fill="#94a3b8"> → income</tspan></text>
      <text x="862" y="166" fill="#34d399">-1200 rent<tspan fill="#94a3b8"> → expense</tspan></text>
      <text x="862" y="194" fill="#f87171">totals<tspan fill="#94a3b8"> → balance</tspan></text>
    </g>
    <g fill="#191c30" stroke="#35354e">
      <rect x="56" y="282" width="258" height="106" rx="12"/>
      <rect x="332" y="282" width="258" height="106" rx="12"/>
      <rect x="608" y="282" width="258" height="106" rx="12"/>
      <rect x="884" y="282" width="260" height="106" rx="12"/>
    </g>
    <g fill="#a3e635" font-size="12" font-weight="700" letter-spacing="2">
      <text x="76" y="309">01 / ADD</text>
      <text x="352" y="309">02 / TOTAL</text>
      <text x="628" y="309">03 / REVIEW</text>
      <text x="904" y="309">04 / CLEAN</text>
    </g>
    <text x="76" y="341" fill="#f1f5f9" font-size="17.0" font-weight="650">Enter a transaction</text>
    <text x="76" y="367" fill="#94a3b8" font-size="13.0">Positive income, negative spend</text>
    <text x="352" y="341" fill="#f1f5f9" font-size="17.0" font-weight="650">Watch totals update</text>
    <text x="352" y="367" fill="#94a3b8" font-size="13.0">Income, expense, balance</text>
    <text x="628" y="341" fill="#f1f5f9" font-size="17.0" font-weight="650">Scan the history</text>
    <text x="628" y="367" fill="#94a3b8" font-size="13.0">Colour-coded entries</text>
    <text x="904" y="341" fill="#f1f5f9" font-size="17.0" font-weight="650">Remove mistakes</text>
    <text x="904" y="367" fill="#94a3b8" font-size="13.0">One-click delete</text>
    <text x="56" y="428" fill="#64748b" font-size="13">HTML5 · CSS3 · Vanilla JavaScript · No build step</text>
  </g>
</svg>
